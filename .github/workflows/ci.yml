name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: ${{ matrix.os }} con Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencias
        run: python -m pip install -r requirements.txt

      - name: Compila
        run: python -m compileall -q inventario generar_inventario.py

      - name: La ayuda arranca
        run: python -m inventario --help

      - name: Pruebas unitarias
        run: python -m unittest discover -s pruebas -v
