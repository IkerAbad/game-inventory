name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install package
        run: python -m pip install .

      - name: Console script
        run: game-inventory --version

      - name: Installed command with empty data
        run: game-inventory --offline --keep --output consola_prueba.xlsx

      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: start.cmd --version

      - name: Lint
        run: python -m pyflakes inventory generate_inventory.py tests

      - name: Compile
        run: python -m compileall -q inventory generate_inventory.py

      - name: Help starts
        run: python -m inventory --help

      - name: Unit tests and coverage
        run: |
          python -m coverage run --source=inventory -m unittest discover -s tests -v
          python -m coverage report --fail-under=97

      - name: Generate with empty data
        run: python generate_inventory.py --offline --keep --output salida_prueba.xlsx

      - name: Check the workbook
        run: |
          python -c "import openpyxl; w=openpyxl.load_workbook('salida_prueba.xlsx'); assert w.sheetnames[:5]==['Games','Space','Summary','Plan','History']; print('sheets OK')"
