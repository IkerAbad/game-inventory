name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: ${{ matrix.os }} con Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencias
        run: python -m pip install -r requirements.txt

      - name: Compila
        run: python -m compileall -q inventario generar_inventario.py

      - name: La ayuda arranca
        run: python -m inventario --help

      - name: Pruebas unitarias
        run: python -m unittest discover -s pruebas -v

      - name: Genera con datos vacios
        run: python generar_inventario.py --sin-red --conservar --salida salida_prueba.xlsx

      - name: Comprueba el Excel
        run: |
          python -c "import openpyxl; w=openpyxl.load_workbook('salida_prueba.xlsx'); assert w.sheetnames[:5]==['Juegos','Espacio','Resumen','Plan','Historico']; print('hojas OK')"
